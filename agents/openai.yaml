interface:
  display_name: "book-commerce-video"
  short_description: "从书评研究到 ChatCut 成片验收的图书短视频流程"
  default_prompt: "使用 $book-commerce-video 把这本书制作成一条可审核的竖屏图书推荐视频。"

dependencies:
  tools:
    - type: "mcp"
      value: "chatcut"
      description: "通过 Hosted ChatCut MCP 创建和编辑可继续修改的视频时间线"
      transport: "streamable_http"
      url: "https://api.chatcut.io/api/external-mcp/mcp"

policy:
  allow_implicit_invocation: true
